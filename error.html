<html>
<head>
    <title>Paiement échoué</title>
    <style>
        /* Centrer le contenu et réduire l'espacement */
        .container {
            text-align: center;
            margin-top: 50px; /* Ajuste l’espace en haut */
        }

        /* Ajuster la taille du logo */
        .logo {
            width: 200px;
            margin-bottom: 10px; /* Réduit l’espace entre le logo et le texte */
        }

        /* Réduire la taille du texte H1 */
        h1 {
            font-size: 20px; /* Ajuste la taille du texte */
            margin-top: 5px; /* Réduit l’espace au-dessus du texte */
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="Logo_AM.CI.JPG" alt="Logo de l'entreprise">
        <h1>Paiement échoué, veuillez réessayer !</h1>
    </div>
</body>
</html>
